server.port=${BACKEND_PORT:3000}
spring.application.name=community-dashboard-management-system-api

# Database configuration (driven by .env / docker-compose env vars)
spring.datasource.url=jdbc:${DB_TYPE:mysql}://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:community_dashboard_management_system_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:mysql}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Swagger UI
springdoc.swagger-ui.path=/api/docs
springdoc.api-docs.path=/api/docs-json

# JWT
jwt.secret=${JWT_SECRET:community-dashboard-mgmt-sys-secret-key-32ch}
jwt.expiration-ms=${JWT_EXPIRY_MS:86400000}

